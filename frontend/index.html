<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- page-metadata -->
    <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070f21" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Resolve the theme before first paint so the drawing sheet never flashes.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('lynn.theme');
        } catch (error) {
          stored = null;
        }
        var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
        var dark =
          preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
